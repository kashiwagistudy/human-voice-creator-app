<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>人力ボイス ― 自分の声で話す ―</title>
<style>
  :root {
    /* ===== デザイントークン：和紙・藍染め・朱印をモチーフにした配色 ===== */
    --paper: #EFEBE2;
    --paper-raised: #FAF8F2;
    --paper-line: #DCD5C6;
    --ink: #2B2620;
    --ink-soft: #6B6259;
    --indigo: #1F3A5F;
    --indigo-deep: #142A45;
    --indigo-tint: #E4E9EE;
    --shu: #C0392B;
    --shu-tint: #F6E1DD;
    --moss: #4C7A5E;
    --moss-tint: #E4EFE9;
    --ochre: #A8752A;
    --ochre-tint: #F4E8D3;
    --crimson: #8C2F2F;
    --crimson-tint: #F2E0DD;
    --radius: 14px;
    --font-display: "Shippori Mincho", "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --font-body: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(31,58,95,0.04), transparent 45%),
      radial-gradient(circle at 85% 30%, rgba(192,57,43,0.03), transparent 40%);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .app-shell { max-width: 640px; margin: 0 auto; padding: 32px 20px 120px; }

  .app-header { text-align: center; margin-bottom: 28px; }
  .app-header .eyebrow {
    font-family: var(--font-display);
    letter-spacing: 0.35em;
    font-size: 12px;
    color: var(--shu);
    margin: 0 0 6px;
  }
  .app-header h1 {
    font-family: var(--font-display);
    font-size: clamp(24px, 6vw, 32px);
    font-weight: 600;
    margin: 0 0 8px;
    color: var(--indigo-deep);
  }
  .app-header .lede {
    margin: 0 auto;
    max-width: 46ch;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .container { display: flex; flex-direction: column; gap: 16px; }

  .card {
    background: var(--paper-raised);
    border: 1px solid var(--paper-line);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 1px 2px rgba(43,38,32,0.04);
  }

  details.card { padding: 0; overflow: hidden; }
  details.card > summary {
    list-style: none;
    cursor: pointer;
    padding: 16px 20px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 16px;
    color: var(--indigo-deep);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card > summary::after {
    content: "▾";
    color: var(--ink-soft);
    transition: transform 0.2s ease;
  }
  details.card[open] > summary::after { transform: rotate(-180deg); }
  details.card > summary:focus-visible { outline: 2px solid var(--indigo); outline-offset: -2px; }
  details.card .recording-area,
  details.card .settings-area { padding: 4px 20px 20px; border-top: 1px solid var(--paper-line); }

  /* ===== 発話カード ===== */
  .yesno-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .yesno-button {
    flex: 1;
    padding: 16px 8px;
    font-size: 17px;
    font-weight: 700;
    font-family: var(--font-body);
    border-radius: 10px;
    border: 2px solid transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .yesno-button.yes { background: var(--moss-tint); color: var(--moss); border-color: var(--moss); }
  .yesno-button.no { background: var(--crimson-tint); color: var(--crimson); border-color: var(--crimson); }
  .yesno-button:hover:not(:disabled) { filter: brightness(0.96); }
  .yesno-button:disabled { opacity: 0.5; cursor: not-allowed; }

  .display-area {
    background: var(--indigo-tint);
    border: 1px dashed var(--indigo);
    border-radius: 10px;
    padding: 18px 16px;
    min-height: 28px;
    font-size: 18px;
    color: var(--indigo-deep);
    margin-bottom: 14px;
    word-break: break-word;
  }
  .text-input {
    width: 100%;
    font-size: 17px;
    padding: 13px 14px;
    border: 1px solid var(--paper-line);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
    margin-bottom: 12px;
    font-family: inherit;
  }
  .text-input:focus-visible { outline: 2px solid var(--indigo); outline-offset: 1px; }

  .main-button {
    width: 100%;
    padding: 15px;
    font-size: 16px;
    font-weight: 700;
    font-family: var(--font-body);
    color: #fff;
    background: var(--indigo);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  .main-button:hover:not(:disabled) { background: var(--indigo-deep); }
  .main-button:active:not(:disabled) { transform: scale(0.99); }
  .main-button:disabled { opacity: 0.5; cursor: not-allowed; }
  .main-button.playing {
    background: var(--shu);
    animation: pulse-soft 1.1s ease-in-out infinite;
  }
  .main-button.small { padding: 10px; font-size: 13px; }

  .quick-phrases { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .phrase-button {
    position: relative;
    padding: 8px 16px 8px 14px;
    font-size: 13px;
    border-radius: 999px;
    border: 1px solid var(--paper-line);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
  }
  .phrase-button:hover:not(:disabled) { border-color: var(--indigo); color: var(--indigo-deep); }
  .phrase-button:disabled { opacity: 0.5; cursor: not-allowed; }
  .phrase-button .checkmark { top: -6px; right: -6px; }

  /* ===== 進捗カード ===== */
  .progress-bar {
    width: 100%;
    height: 10px;
    background: var(--indigo-tint);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--indigo), var(--shu));
    border-radius: 999px;
    transition: width 0.4s ease;
  }
  .progress-text { margin-top: 8px; font-size: 13px; color: var(--ink-soft); text-align: center; }

  /* ===== モードタブ ===== */
  .mode-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .mode-tab {
    flex: 1;
    padding: 10px;
    font-size: 13px;
    font-weight: 700;
    border-radius: 8px;
    border: 1px solid var(--paper-line);
    background: var(--paper);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .mode-tab.active { background: var(--indigo); border-color: var(--indigo); color: #fff; }
  .mode-tab:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ===== 音声登録エリア（ひらがな） ===== */
  .char-selector-grid h3 {
    font-family: var(--font-display);
    font-size: 14px;
    color: var(--ink);
    margin: 18px 0 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .char-selector-grid h3:first-child { margin-top: 6px; }
  .group-badge {
    font-family: var(--font-body);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
  }
  .group-badge.seion { background: var(--indigo-tint); color: var(--indigo-deep); }
  .group-badge.dakuten { background: var(--shu-tint); color: var(--shu); }
  .group-badge.special { background: var(--moss-tint); color: var(--moss); }

  .char-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .char-button {
    position: relative;
    width: 42px;
    height: 42px;
    border-radius: 8px;
    border: 1px solid var(--paper-line);
    background: #fff;
    color: var(--ink);
    font-size: 16px;
    cursor: pointer;
  }
  .char-button:hover:not(:disabled) { border-color: var(--indigo); }
  .char-button.selected {
    background: var(--indigo);
    border-color: var(--indigo);
    color: #fff;
  }
  .char-button:disabled { opacity: 0.45; cursor: not-allowed; }
  .char-button .checkmark,
  .phrase-button .checkmark,
  .phrase-chip .checkmark {
    display: none;
    position: absolute;
    top: -7px;
    right: -7px;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: var(--shu);
    color: #fff;
    font-size: 10px;
    line-height: 17px;
    text-align: center;
    transform: rotate(-14deg);
    box-shadow: 0 0 0 2px var(--paper-raised);
  }
  .char-button.recorded .checkmark,
  .phrase-button.recorded .checkmark,
  .phrase-chip.recorded .checkmark { display: block; }

  /* ===== 音声登録エリア（フレーズ） ===== */
  .phrase-target-hint { font-size: 13px; color: var(--ink-soft); margin: 0 0 12px; }
  .phrase-target-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .phrase-chip {
    position: relative;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--paper-line);
    background: #fff;
    color: var(--ink);
    font-size: 14px;
    cursor: pointer;
  }
  .phrase-chip:hover:not(:disabled) { border-color: var(--indigo); }
  .phrase-chip.selected { background: var(--indigo); border-color: var(--indigo); color: #fff; }
  .phrase-chip:disabled { opacity: 0.45; cursor: not-allowed; }
  .phrase-add-row { display: flex; gap: 8px; }
  .phrase-add-row input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--paper-line);
    font-size: 14px;
    font-family: inherit;
  }
  .phrase-add-row button {
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid var(--indigo);
    background: var(--indigo-tint);
    color: var(--indigo-deep);
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .phrase-add-row button:hover:not(:disabled) { background: var(--indigo); color: #fff; }
  .phrase-add-row button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ===== 録音操作 ===== */
  .record-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 18px 0 10px; }
  .record-button {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 1px solid var(--paper-line);
    background: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .record-button:hover:not(:disabled) { border-color: var(--indigo); }
  .record-button:disabled { opacity: 0.4; cursor: not-allowed; }
  #record-btn.recording {
    background: var(--crimson);
    border-color: var(--crimson);
    color: #fff;
    animation: pulse-ring 1.2s ease-out infinite;
  }
  .record-hint {
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    min-height: 18px;
  }

  /* ===== ファイル取り込み・トリムパネル ===== */
  .trim-panel {
    margin-top: 16px;
    padding: 14px;
    border: 1px dashed var(--indigo);
    border-radius: 10px;
    background: var(--indigo-tint);
  }
  .trim-filename { margin: 0 0 8px; font-size: 12px; color: var(--indigo-deep); word-break: break-all; }
  .trim-panel audio { width: 100%; margin-bottom: 10px; }
  .trim-range-row { display: flex; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  .trim-range-row label { font-size: 12px; color: var(--ink-soft); display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 110px; }
  .trim-range-row input[type="number"] {
    padding: 8px;
    border-radius: 6px;
    border: 1px solid var(--paper-line);
    font-size: 14px;
  }
  .trim-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .trim-actions button {
    flex: 1;
    min-width: 90px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--paper-line);
    background: #fff;
    font-size: 13px;
    cursor: pointer;
  }
  .trim-actions button:hover:not(:disabled) { border-color: var(--indigo); }
  .trim-actions button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ===== 設定エリア ===== */
  .setting-item { margin: 16px 0; }
  .setting-item label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
  .setting-item input[type="range"] {
    width: 100%;
    accent-color: var(--indigo);
  }
  .checkbox-label {
    display: flex !important;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--ink) !important;
    cursor: pointer;
  }
  .checkbox-label input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--indigo); flex-shrink: 0; }
  .setting-help { font-size: 12px; color: var(--ink-soft); margin: 4px 0 0 25px; }
  .data-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
  .data-buttons button,
  .data-buttons .file-label {
    flex: 1;
    min-width: 130px;
    text-align: center;
    padding: 11px 10px;
    border-radius: 8px;
    border: 1px solid var(--indigo);
    background: var(--indigo-tint);
    color: var(--indigo-deep);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .data-buttons button:hover,
  .data-buttons .file-label:hover { background: var(--indigo); color: #fff; }
  #import-file { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; }
  .danger-button {
    width: 100%;
    padding: 11px 10px;
    border-radius: 8px;
    border: 1px solid var(--crimson);
    background: var(--crimson-tint);
    color: var(--crimson);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .danger-button:hover { background: var(--crimson); color: #fff; }

  /* ===== ステータス表示 ===== */
  .status-display {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    max-width: calc(100% - 32px);
    background: var(--indigo-deep);
    color: #fff;
    padding: 11px 18px;
    border-radius: 999px;
    font-size: 13px;
    text-align: center;
    box-shadow: 0 4px 14px rgba(20,42,69,0.25);
    z-index: 10;
  }
  .status-display:empty { display: none; }
  .status-display.success { background: var(--moss); }
  .status-display.warning { background: var(--ochre); }
  .status-display.error { background: var(--crimson); }

  button:focus-visible,
  .char-button:focus-visible,
  .phrase-button:focus-visible,
  .phrase-chip:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }

  @keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 rgba(140,47,47,0.45); }
    100% { box-shadow: 0 0 0 12px rgba(140,47,47,0); }
  }
  @keyframes pulse-soft {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.85; }
  }
  @media (prefers-reduced-motion: reduce) {
    #record-btn.recording, .main-button.playing { animation: none; }
  }

  @media (max-width: 420px) {
    .char-button { width: 38px; height: 38px; font-size: 15px; }
    .record-button { width: 50px; height: 50px; font-size: 18px; }
  }
</style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <p class="eyebrow">JINRIKI VOICE</p>
      <h1>人力ボイス</h1>
      <p class="lede">ひらがな一音ずつ、またはフレーズまるごと、あなた自身の声を残しておくと、入力した文章をその声で読み上げます。</p>
    </header>

    <main class="container">
      <section class="card speak-card">
        <div class="yesno-row">
          <button type="button" id="yes-btn" class="yesno-button yes">✓ はい</button>
          <button type="button" id="no-btn" class="yesno-button no">✕ いいえ</button>
        </div>
        <div id="display-area" class="display-area" aria-live="polite">入力内容をここに表示</div>
        <input type="text" id="input-box" class="text-input" placeholder="ひらがなで入力（濁点・半濁点対応）" aria-label="テキスト入力ボックス">
        <button id="speak-btn" class="main-button">この内容で話す</button>
        <div class="quick-phrases" id="quick-phrases" aria-label="よく使う言葉"></div>
      </section>

      <section class="card progress-card">
        <div class="progress-bar" aria-label="録音進捗">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-text" id="progress-text">音声データの登録を開始してください</div>
      </section>

      <details class="card">
        <summary>音声の登録</summary>
        <div class="recording-area">
          <div class="mode-tabs" role="tablist">
            <button type="button" class="mode-tab active" id="mode-tab-char" role="tab" aria-selected="true">ひらがな一音ずつ</button>
            <button type="button" class="mode-tab" id="mode-tab-phrase" role="tab" aria-selected="false">フレーズをまるごと</button>
          </div>

          <div id="char-mode-panel">
            <div class="char-selector-grid" id="char-selector-grid"></div>
          </div>

          <div id="phrase-mode-panel" hidden>
            <p class="phrase-target-hint">よく使う言葉や自分で追加した言葉を、まるごと自然な声で残せます。一音ずつのつなぎ合わせより自然に聞こえるので、優先して再生されます。</p>
            <div class="phrase-target-grid" id="phrase-target-grid"></div>
            <div class="phrase-add-row">
              <input type="text" id="new-phrase-input" placeholder="新しいフレーズを追加（例: 痛いです）" aria-label="新しいフレーズを追加">
              <button type="button" id="add-phrase-btn">追加</button>
            </div>
          </div>

          <div class="record-controls">
            <button id="record-btn" class="record-button" title="録音開始" aria-label="録音開始">🎤</button>
            <button id="play-btn" class="record-button" title="試聴" aria-label="試聴">▶</button>
            <button id="delete-btn" class="record-button" title="この録音を削除" aria-label="この録音を削除">🗑</button>
            <button id="import-btn" class="record-button" title="音声・動画ファイルから登録" aria-label="音声・動画ファイルから登録" type="button">📁</button>
          </div>
          <input type="file" id="audio-file-input" accept="audio/*,video/*" aria-label="音声または動画ファイルを選択" hidden>
          <div class="record-hint" id="record-hint">音またはフレーズを選ぶと、ここに案内が表示されます。</div>

          <div class="trim-panel" id="trim-panel" hidden>
            <p class="trim-filename" id="trim-filename"></p>
            <audio id="trim-audio-preview" controls></audio>
            <div class="trim-range-row">
              <label>開始（秒）<input type="number" id="trim-start" min="0" step="0.05" value="0"></label>
              <label>終了（秒）<input type="number" id="trim-end" min="0" step="0.05" value="1"></label>
            </div>
            <div class="trim-actions">
              <button type="button" id="trim-preview-btn">この範囲を試聴</button>
              <button type="button" id="trim-save-btn">この範囲を登録</button>
              <button type="button" id="trim-cancel-btn">キャンセル</button>
            </div>
          </div>
        </div>
      </details>

      <details class="card">
        <summary>設定</summary>
        <div class="settings-area">
          <div class="setting-item">
            <label for="speed-slider">話す速さ: <span id="speed-value">1.0</span>倍</label>
            <input type="range" id="speed-slider" min="0.5" max="2" step="0.1" value="1">
          </div>
          <div class="setting-item">
            <label for="volume-slider">音量: <span id="volume-value">100</span>%</label>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
          </div>
          <div class="setting-item">
            <label for="pause-slider">音素間の間隔: <span id="pause-value">100</span>ms</label>
            <input type="range" id="pause-slider" min="0" max="300" step="10" value="100">
          </div>
          <div class="setting-item">
            <label class="checkbox-label"><input type="checkbox" id="fallback-tts-checkbox" checked>未登録の音は合成音声で補って読み上げる</label>
            <p class="setting-help">録音がまだ揃っていない言葉でも、無言にならず端末の合成音声で読み上げます。</p>
          </div>
          <div class="setting-item data-buttons">
            <button id="export-btn">データを保存</button>
            <label for="import-file" class="file-label">データを読込</label>
            <input type="file" id="import-file" accept=".json" aria-label="データ読み込みファイル選択">
          </div>
          <div class="setting-item">
            <button id="reset-btn" class="danger-button">すべての録音データを削除</button>
          </div>
        </div>
      </details>
    </main>

    <div id="status-display" class="status-display" role="status" aria-live="polite">アプリへようこそ！</div>
  </div>

  <script>
    // ==================================================================
    // 高度なIndexedDB管理クラス（複数ストア対応：voices＝一音ずつ／phrases＝フレーズ丸ごと）
    // ==================================================================
    class AdvancedIndexedDB {
        constructor(dbName, version = 1) {
            this.dbName = dbName;
            this.version = version;
            this.db = null;
        }

        async init() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(this.dbName, this.version);

                request.onerror = () => reject(new Error(`データベースの初期化に失敗しました: ${request.error?.message || '不明なエラー'}`));
                request.onsuccess = () => {
                    this.db = request.result;
                    this.db.onerror = (event) => console.error('Database error:', event);
                    resolve(this.db);
                };

                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    // 既存データを壊さないよう、無ければ作るだけにする（v1→v2の既存ユーザーも安全）
                    if (!db.objectStoreNames.contains('voices')) {
                        db.createObjectStore('voices', { keyPath: 'char' });
                    }
                    if (!db.objectStoreNames.contains('phrases')) {
                        db.createObjectStore('phrases', { keyPath: 'text' });
                    }
                };
            });
        }

        async put(storeName, data) {
            if (!this.db) throw new Error('Database not initialized');
            return new Promise((resolve, reject) => {
                const transaction = this.db.transaction([storeName], 'readwrite');
                const store = transaction.objectStore(storeName);
                const request = store.put(data);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async get(storeName, key) {
            if (!this.db) throw new Error('Database not initialized');
            return new Promise((resolve, reject) => {
                const transaction = this.db.transaction([storeName], 'readonly');
                const store = transaction.objectStore(storeName);
                const request = store.get(key);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async delete(storeName, key) {
            if (!this.db) throw new Error('Database not initialized');
            return new Promise((resolve, reject) => {
                const transaction = this.db.transaction([storeName], 'readwrite');
                const store = transaction.objectStore(storeName);
                const request = store.delete(key);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        async clear(storeName) {
            if (!this.db) throw new Error('Database not initialized');
            return new Promise((resolve, reject) => {
                const transaction = this.db.transaction([storeName], 'readwrite');
                const store = transaction.objectStore(storeName);
                const request = store.clear();
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        async getAllKeys(storeName) {
            if (!this.db) throw new Error('Database not initialized');
            return new Promise((resolve, reject) => {
                const transaction = this.db.transaction([storeName], 'readonly');
                const store = transaction.objectStore(storeName);
                const request = store.getAllKeys();
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async getAll(storeName) {
            if (!this.db) throw new Error('Database not initialized');
            return new Promise((resolve, reject) => {
                const transaction = this.db.transaction([storeName], 'readonly');
                const store = transaction.objectStore(storeName);
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async bulkAdd(storeName, dataArray) {
            if (!this.db) throw new Error('Database not initialized');
            return new Promise((resolve, reject) => {
                const transaction = this.db.transaction([storeName], 'readwrite');
                const store = transaction.objectStore(storeName);
                dataArray.forEach(data => store.put(data));
                transaction.oncomplete = () => resolve();
                transaction.onerror = () => reject(transaction.error);
            });
        }
    }

    // ==================================================================
    // アプリケーション初期化
    // ==================================================================
    window.onload = async () => {
        try {
            showStatus('アプリを初期化中...', 'warning');
            await db.init();
            await initializeAudioContext();
            await loadPhraseTargets();
            setupUI();
            setupEventListeners();
            await updateRecordedStatus();
            updateRecordHint();
            showStatus('アプリが正常に初期化されました。', 'success');
        } catch (error) {
            console.error('初期化エラー:', error);
            showStatus(`初期化に失敗しました: ${error.message}`, 'error');
        }
    };

    async function loadPhraseTargets() {
        try {
            const recordedPhraseKeys = await db.getAllKeys('phrases');
            recordedPhraseKeys.forEach(key => {
                if (!phraseTargets.includes(key)) phraseTargets.push(key);
            });
        } catch (e) {
            // 初回起動時などは無視して既定のクイックフレーズのみで続行する
        }
    }

    async function initializeAudioContext() {
        try {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) throw new Error('Web Audio APIがサポートされていません');

            audioContext = new AudioContextClass();
            gainNode = audioContext.createGain();
            gainNode.connect(audioContext.destination);

            const resumeAudioContext = async () => {
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }
            };
            ['click', 'touch', 'keydown'].forEach(eventType => {
                document.addEventListener(eventType, resumeAudioContext, { once: true });
            });
        } catch (error) {
            throw new Error('音声機能の初期化に失敗しました');
        }
    }

    function getSupportedMimeType() {
        if (typeof MediaRecorder === 'undefined' || !MediaRecorder.isTypeSupported) return '';
        const candidates = [
            'audio/webm;codecs=opus',
            'audio/webm',
            'audio/mp4',
            'audio/mp4;codecs=mp4a.40.2',
            'audio/ogg;codecs=opus'
        ];
        return candidates.find(type => MediaRecorder.isTypeSupported(type)) || '';
    }

    // ==================================================================
    // 録音データの読み書き（一音／フレーズを同じインターフェースで扱う）
    // ==================================================================
    function storeOf(target) { return target.type === 'char' ? 'voices' : 'phrases'; }

    async function saveRecording(target, blob) {
        if (target.type === 'char') {
            await db.put('voices', { char: target.key, blob });
        } else {
            await db.put('phrases', { text: target.key, blob });
        }
    }

    async function getRecording(target) {
        return db.get(storeOf(target), target.key);
    }

    async function deleteRecording(target) {
        return db.delete(storeOf(target), target.key);
    }

    // ==================================================================
    // UI構築 & イベントリスナー
    // ==================================================================
    function setupUI() {
        for (const [groupName, group] of Object.entries(HIRAGANA_MAP)) {
            const groupTitle = document.createElement('h3');
            groupTitle.innerHTML = `${groupName} <span class="group-badge ${getGroupClass(groupName)}">${Object.values(group).flat().length}音</span>`;
            elements.charSelectorGrid.appendChild(groupTitle);

            for (const [rowName, chars] of Object.entries(group)) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'char-row';
                chars.forEach(char => {
                    const button = createCharButton(char);
                    rowDiv.appendChild(button);
                });
                elements.charSelectorGrid.appendChild(rowDiv);
            }
        }

        QUICK_PHRASES.forEach(phrase => {
            const button = document.createElement('button');
            button.className = 'phrase-button';
            button.dataset.phrase = phrase;
            button.textContent = phrase;
            button.innerHTML += '<div class="checkmark">✓</div>';
            button.onclick = () => playPhrase(phrase);
            elements.quickPhrasesContainer.appendChild(button);
        });

        renderPhraseTargetList();
    }

    function createCharButton(char) {
        const button = document.createElement('button');
        button.className = 'char-button';
        button.textContent = char;
        button.dataset.char = char;
        button.setAttribute('aria-label', `音素「${char}」`);
        button.innerHTML += '<div class="checkmark">✓</div>';
        button.onclick = () => selectTarget({ type: 'char', key: char });
        return button;
    }

    function renderPhraseTargetList() {
        elements.phraseTargetGrid.innerHTML = '';
        phraseTargets.forEach(phrase => {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'phrase-chip';
            chip.textContent = phrase;
            chip.dataset.phrase = phrase;
            chip.setAttribute('aria-label', `フレーズ「${phrase}」`);
            chip.innerHTML += '<div class="checkmark">✓</div>';
            if (recordedPhraseSet.has(phrase)) chip.classList.add('recorded');
            if (currentTarget && currentTarget.type === 'phrase' && currentTarget.key === phrase) {
                chip.classList.add('selected');
                chip.setAttribute('aria-selected', 'true');
            }
            chip.onclick = () => selectTarget({ type: 'phrase', key: phrase });
            elements.phraseTargetGrid.appendChild(chip);
        });
    }

    function getGroupClass(groupName) {
        if (groupName.includes('清音')) return 'seion';
        if (groupName.includes('濁音')) return 'dakuten';
        if (groupName.includes('特殊')) return 'special';
        return '';
    }

        elements.inputBox.addEventListener('input', () => {
            elements.displayArea.textContent = elements.inputBox.value || '入力内容をここに表示';
        });
        elements.inputBox.addEventListener('paste', handleTextPaste);

        elements.recordBtn.onclick = handleRecord;
        elements.playBtn.onclick = handlePlay;
        elements.deleteBtn.onclick = handleDelete;
        elements.importBtn.onclick = () => {
            if (!currentTarget) {
                showStatus('先に登録したい音・フレーズを選んでください。', 'warning');
                return;
            }
            elements.audioFileInput.click();
        };
        elements.audioFileInput.onchange = handleAudioFileSelect;

        elements.speakBtn.onclick = handleSpeak;
        elements.yesBtn.onclick = () => playPhrase('はい');
        elements.noBtn.onclick = () => playPhrase('いいえ');

        elements.modeTabChar.onclick = () => switchMode('char');
        elements.modeTabPhrase.onclick = () => switchMode('phrase');
        elements.addPhraseBtn.onclick = handleAddPhrase;
        elements.newPhraseInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); handleAddPhrase(); }
        });

        elements.trimPreviewBtn.onclick = handleTrimPreview;
        elements.trimSaveBtn.onclick = handleTrimSave;
        elements.trimCancelBtn.onclick = closeTrimPanel;

        elements.speedSlider.oninput = () => { elements.speedValue.textContent = parseFloat(elements.speedSlider.value).toFixed(1); };
        elements.volumeSlider.oninput = () => {
            const vol = parseFloat(elements.volumeSlider.value);
            elements.volumeValue.textContent = Math.round(vol * 100);
            if (gainNode) gainNode.gain.value = vol;
        };
        elements.pauseSlider.oninput = () => {
            pauseDuration = parseInt(elements.pauseSlider.value);
            elements.pauseValue.textContent = pauseDuration;
        };

        elements.importFile.onchange = importData;
        elements.resetBtn.onclick = resetAllData;

    // 貼り付け時、対応していない文字（漢字・英数字等）が含まれていないか早めに知らせる。
    // 入力中（IME変換の途中経過）は誤検知しやすいため、あえて貼り付け時のみ実施する。
    function handleTextPaste() {
        setTimeout(() => {
            const text = elements.inputBox.value;
            const invalidChars = [...new Set(
                Array.from(text).filter(char => !TARGET_CHARS.includes(char) && char !== '゛' && char !== '゜')
            )];
            if (invalidChars.length > 0) {
                showStatus(`ひらがな以外の文字が含まれています: ${invalidChars.join(' ')}（合成音声での読み上げは可能です）`, 'warning', 4000);
            }
        }, 10);
    }

    function switchMode(mode) {
        if (isRecording || isPlaying) return;
        elements.charModePanel.hidden = mode !== 'char';
        elements.phraseModePanel.hidden = mode !== 'phrase';
        elements.modeTabChar.classList.toggle('active', mode === 'char');
        elements.modeTabChar.setAttribute('aria-selected', (mode === 'char').toString());
        elements.modeTabPhrase.classList.toggle('active', mode === 'phrase');
        elements.modeTabPhrase.setAttribute('aria-selected', (mode === 'phrase').toString());
        closeTrimPanel();
    }

    function handleAddPhrase() {
        const text = elements.newPhraseInput.value.trim();
        if (!text) return;
        if (!phraseTargets.includes(text)) {
            phraseTargets.push(text);
            renderPhraseTargetList();
        }
        elements.newPhraseInput.value = '';
        selectTarget({ type: 'phrase', key: text });
    }

    // ==================================================================
    // UI制御とフィードバック
    // ==================================================================
    function showStatus(message, type = 'normal', duration = 3000) {
        elements.statusDisplay.textContent = message;
        elements.statusDisplay.className = 'status-display';
        if (type === 'success') elements.statusDisplay.classList.add('success');
        else if (type === 'error') elements.statusDisplay.classList.add('error');
        else if (type === 'warning') elements.statusDisplay.classList.add('warning');

        if (type !== 'error' && duration > 0) {
            setTimeout(() => {
                if (elements.statusDisplay.textContent === message) {
                    elements.statusDisplay.textContent = '';
                    elements.statusDisplay.className = 'status-display';
                }
            }, duration);
        }
    }

    function selectTarget(target) {
        if (isRecording || isPlaying) return;
        currentTarget = target;
        closeTrimPanel();

        document.querySelectorAll('.char-button').forEach(btn => {
            btn.classList.remove('selected');
            btn.setAttribute('aria-selected', 'false');
        });
        if (target.type === 'char') {
            const btn = document.querySelector(`.char-button[data-char="${target.key}"]`);
            if (btn) { btn.classList.add('selected'); btn.setAttribute('aria-selected', 'true'); }
        }
        renderPhraseTargetList();
        updateRecordHint();
    }

    async function updateRecordHint() {
        if (!currentTarget) {
            elements.recordHint.textContent = '音またはフレーズを選ぶと、ここに録音の案内が表示されます。';
            return;
        }
        const label = currentTarget.type === 'char' ? `「${currentTarget.key}」` : `フレーズ「${currentTarget.key}」`;
        const maxSec = currentTarget.type === 'char' ? 3 : 8;
        try {
            const record = await getRecording(currentTarget);
            elements.recordHint.textContent = record
                ? `${label}は登録済みです。🎤で録り直し、📁でファイルから再登録、▶で確認、🗑で削除できます。`
                : `${label}は未登録です。🎤ボタン、または📁で音声・動画ファイルから登録できます（最大${maxSec}秒。🎤はもう一度押すと途中で停止します）。`;
        } catch (e) {
            elements.recordHint.textContent = `${label}を選択中。`;
        }
    }

    async function updateRecordedStatus() {
        try {
            const recordedChars = await db.getAllKeys('voices');
            document.querySelectorAll('.char-button').forEach(btn => {
                const isRecorded = recordedChars.includes(btn.dataset.char);
                btn.classList.toggle('recorded', isRecorded);
                btn.setAttribute('aria-label', `音素「${btn.dataset.char}」${isRecorded ? '（録音済み）' : '（未録音）'}`);
            });
            const recordedCount = recordedChars.filter(char => TARGET_CHARS.includes(char)).length;
            const progressPercent = (recordedCount / TARGET_CHARS.length) * 100;
            elements.progressFill.style.width = `${progressPercent}%`;
            elements.progressText.textContent = `${recordedCount}/${TARGET_CHARS.length}個 (${Math.round(progressPercent)}%) 登録済み`;

            const recordedPhrases = await db.getAllKeys('phrases');
            recordedPhraseSet = new Set(recordedPhrases);
            document.querySelectorAll('.phrase-button').forEach(btn => {
                btn.classList.toggle('recorded', recordedPhraseSet.has(btn.dataset.phrase));
            });
            renderPhraseTargetList();
        } catch (error) {
            showStatus('状態更新に失敗しました。', 'error');
        }
    }

    // disabled: 一括で操作不可にするかどうか。録音中は録音ボタンだけ有効のままにして、
    // もう一度押すと停止できるようにする。
    function toggleUI(disabled) {
        const controls = [
            elements.recordBtn, elements.playBtn, elements.deleteBtn, elements.importBtn,
            elements.speakBtn, elements.exportBtn, elements.resetBtn, elements.yesBtn, elements.noBtn,
            elements.modeTabChar, elements.modeTabPhrase, elements.addPhraseBtn,
            elements.trimPreviewBtn, elements.trimSaveBtn, elements.trimCancelBtn
        ];
        controls.forEach(btn => {
            if (!btn) return;
            if (btn === elements.recordBtn && isRecording) return;
            btn.disabled = disabled;
            btn.setAttribute('aria-disabled', disabled.toString());
        });
        elements.importFile.disabled = disabled;
        elements.audioFileInput.disabled = disabled;
        elements.newPhraseInput.disabled = disabled;
        elements.fallbackTtsCheckbox.disabled = disabled;
    }

    // ==================================================================
    // 音韻解析システム
    // ==================================================================
    function parseTextToMorae(text) {
        const morae = [];
        // Unicode正規化：結合濁点/半濁点（IME入力等）を「が」等の単一文字に統合する
        text = text.normalize('NFC');

        const dakuonMap = { 'か':'が', 'き':'ぎ', 'く':'ぐ', 'け':'げ', 'こ':'ご', 'さ':'ざ', 'し':'じ', 'す':'ず', 'せ':'ぜ', 'そ':'ぞ', 'た':'だ', 'ち':'ぢ', 'つ':'づ', 'て':'で', 'と':'ど', 'は':'ば', 'ひ':'び', 'ふ':'ぶ', 'へ':'べ', 'ほ':'ぼ' };
        const handakuonMap = { 'は':'ぱ', 'ひ':'ぴ', 'ふ':'ぷ', 'へ':'ぺ', 'ほ':'ぽ' };
        // 独立した濁点/半濁点記号（結合文字ではない全角記号）を入力手段として使う場合に対応
        const dakuonMark = '゛';
        const handakuonMark = '゜';

        let i = 0;
        while (i < text.length) {
            let char = text[i];
            let nextChar = text[i + 1];

            // 拗音（きゃ等）は特別扱いしなくても、下のelse節で「き」→「ゃ」と
            // 1文字ずつ順番に処理される（どちらも録音済みの単音として存在する）ため、
            // 結果として録音済みの2音を続けて再生する形になる。
            if (nextChar === dakuonMark && dakuonMap[char]) {
                morae.push(dakuonMap[char]);
                i += 2;
            } else if (nextChar === handakuonMark && handakuonMap[char]) {
                morae.push(handakuonMap[char]);
                i += 2;
            } else {
                morae.push(char);
                i += 1;
            }
        }
        return morae;
    }

    // ==================================================================
    // 音声録音・再生システム
    // ==================================================================
    async function handleRecord() {
        // 録音中にもう一度押した場合は、そこで録音を止める
        if (isRecording) {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                clearTimeout(recordTimeoutId);
                mediaRecorder.stop();
            }
            return;
        }

        if (!currentTarget) {
            showStatus('先に録音したい音・フレーズを選んでください。', 'warning');
            return;
        }
        if (!navigator.mediaDevices?.getUserMedia) {
            showStatus('このブラウザではマイク録音がサポートされていません。', 'error');
            return;
        }

        const label = currentTarget.type === 'char' ? `「${currentTarget.key}」` : `フレーズ「${currentTarget.key}」`;
        const maxDuration = currentTarget.type === 'phrase' ? 8000 : 3000;

        isRecording = true;
        toggleUI(true);
        elements.recordBtn.classList.add('recording');
        elements.recordBtn.setAttribute('aria-label', '録音停止');
        showStatus(`🔴 録音中... ${label}（もう一度押すと停止／最大${maxDuration / 1000}秒）`, 'warning', 0);

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
            const mimeType = getSupportedMimeType();
            mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) audioChunks.push(e.data); };
            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                if (audioBlob.size > 100) { // データサイズの簡易チェック
                    try {
                        await saveRecording(currentTarget, audioBlob);
                        showStatus(`${label}の録音が完了！`, 'success');
                        await updateRecordedStatus();
                        updateRecordHint();
                    } catch (e) {
                        showStatus('録音データの保存に失敗しました。', 'error');
                    }
                } else {
                    showStatus('録音データが小さすぎます。もう一度お試しください。', 'error');
                }
                stream.getTracks().forEach(track => track.stop());
                elements.recordBtn.classList.remove('recording');
                elements.recordBtn.setAttribute('aria-label', '録音開始');
                isRecording = false;
                toggleUI(false);
            };
            mediaRecorder.start();
            recordTimeoutId = setTimeout(() => {
                if (mediaRecorder.state === 'recording') mediaRecorder.stop();
            }, maxDuration);
        } catch (err) {
            showStatus('マイクへのアクセスに失敗しました。', 'error');
            elements.recordBtn.classList.remove('recording');
            elements.recordBtn.setAttribute('aria-label', '録音開始');
            isRecording = false;
            toggleUI(false);
        }
    }

    async function handlePlay() {
        if (!currentTarget) {
            showStatus('先に確認したい音・フレーズを選んでください。', 'warning');
            return;
        }
        const record = await getRecording(currentTarget);
        if (!record) {
            showStatus('まだ録音されていません。', 'warning');
            return;
        }
        if (currentTarget.type === 'char') {
            await playSequence([currentTarget.key]);
        } else {
            await playPhraseClip(currentTarget.key, record);
        }
    }

    async function handleDelete() {
        if (!currentTarget) {
            showStatus('先に削除したい音・フレーズを選んでください。', 'warning');
            return;
        }
        const record = await getRecording(currentTarget);
        if (!record) {
            showStatus('まだ録音されていません。', 'warning');
            return;
        }
        const label = currentTarget.type === 'char' ? `「${currentTarget.key}」` : `フレーズ「${currentTarget.key}」`;
        if (!window.confirm(`${label}の録音を削除しますか？この操作は取り消せません。`)) return;
        try {
            await deleteRecording(currentTarget);
            if (currentTarget.type === 'phrase' && !QUICK_PHRASES.includes(currentTarget.key)) {
                phraseTargets = phraseTargets.filter(p => p !== currentTarget.key);
            }
            showStatus(`${label}の録音を削除しました。`, 'success');
            await updateRecordedStatus();
            updateRecordHint();
        } catch (e) {
            showStatus('削除に失敗しました。', 'error');
        }
    }

    function playPhrase(phrase) {
        if (isRecording || isPlaying) return;
        elements.inputBox.value = phrase;
        elements.displayArea.textContent = phrase;
        handleSpeak();
    }

    async function handleSpeak() {
        if (isRecording || isPlaying) return;
        const text = elements.inputBox.value.trim();
        if (!text) {
            showStatus('テキストを入力してください。', 'warning');
            return;
        }

        // 1. フレーズがまるごと自然な声で録音されていれば最優先（一音ずつのつなぎより自然）
        try {
            const phraseRecord = await db.get('phrases', text);
            if (phraseRecord) {
                await playPhraseClip(text, phraseRecord);
                return;
            }
        } catch (e) { /* 続行：フレーズ未登録として音素合成に進む */ }

        // 2. ひらがなとして解析できる場合は、録音済みの単音をつなげて再生
        const morae = parseTextToMorae(text);
        const allValidHiragana = morae.every(m => TARGET_CHARS.includes(m));

        if (allValidHiragana) {
            const missingChars = new Set();
            for (const mora of morae) {
                const record = await db.get('voices', mora);
                if (!record) missingChars.add(mora);
            }
            if (missingChars.size === 0) {
                await playSequence(morae);
                return;
            }
            if (elements.fallbackTtsCheckbox.checked && speakWithSynthesis(text)) {
                showStatus(`「${[...missingChars].join(', ')}」が未登録のため、合成音声で読み上げます。`, 'warning');
                return;
            }
            showStatus(`「${[...missingChars].join(', ')}」の音が未録音です。`, 'error');
            return;
        }

        // 3. ひらがな以外の文字を含む場合
        if (elements.fallbackTtsCheckbox.checked && speakWithSynthesis(text)) {
            showStatus('自分の声のデータにない文字が含まれるため、合成音声で読み上げます。', 'warning');
            return;
        }
        showStatus('ひらがな以外の文字（漢字・英数字等）には対応していません。', 'error');
    }

    async function playSequence(morae, index = 0) {
        if (index === 0) {
            isPlaying = true;
            toggleUI(true);
            elements.speakBtn.classList.add('playing');
        }

        if (index >= morae.length || isRecording) {
            isPlaying = false;
            toggleUI(false);
            elements.speakBtn.classList.remove('playing');
            if (index >= morae.length) showStatus('再生が完了しました。', 'success');
            return;
        }

        const mora = morae[index];
        showStatus(`再生中... 「${mora}」 (${index + 1}/${morae.length})`, 'warning', 0);

        if (mora === 'っ') {
            // 「っ」は無音の詰まりなので、通常の音素間隔より少し長めに取ると自然に聞こえる
            const pauseTime = (pauseDuration + 150) / parseFloat(elements.speedSlider.value);
            setTimeout(() => playSequence(morae, index + 1), pauseTime);
            return;
        }

        const record = await db.get('voices', mora);
        if (record && audioContext) {
            try {
                const arrayBuffer = await record.blob.arrayBuffer();
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                const source = audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.playbackRate.value = parseFloat(elements.speedSlider.value);
                source.connect(gainNode);
                source.start();
                source.onended = () => {
                    const intervalTime = pauseDuration / parseFloat(elements.speedSlider.value);
                    setTimeout(() => playSequence(morae, index + 1), intervalTime);
                };
            } catch (e) {
                console.error('音声デコードエラー:', e);
                playSequence(morae, index + 1);
            }
        } else {
            playSequence(morae, index + 1);
        }
    }

    async function playPhraseClip(text, record) {
        isPlaying = true;
        toggleUI(true);
        elements.speakBtn.classList.add('playing');
        showStatus(`再生中...「${text}」`, 'warning', 0);
        try {
            const arrayBuffer = await record.blob.arrayBuffer();
            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
            const source = audioContext.createBufferSource();
            source.buffer = audioBuffer;
            source.playbackRate.value = parseFloat(elements.speedSlider.value);
            source.connect(gainNode);
            source.onended = () => {
                isPlaying = false;
                toggleUI(false);
                elements.speakBtn.classList.remove('playing');
                showStatus('再生が完了しました。', 'success');
            };
            source.start();
        } catch (e) {
            console.error('フレーズ再生エラー:', e);
            isPlaying = false;
            toggleUI(false);
            elements.speakBtn.classList.remove('playing');
            showStatus('フレーズの再生に失敗しました。', 'error');
        }
    }

    // 端末組み込みの音声合成（Web Speech API）で読み上げる。録音が未完成でも無言にしないための保険。
    function speakWithSynthesis(text) {
        if (!('speechSynthesis' in window)) return false;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        utterance.rate = Math.max(0.1, Math.min(10, parseFloat(elements.speedSlider.value) || 1));
        utterance.volume = parseFloat(elements.volumeSlider.value);
        isPlaying = true;
        toggleUI(true);
        elements.speakBtn.classList.add('playing');
        utterance.onend = utterance.onerror = () => {
            isPlaying = false;
            toggleUI(false);
            elements.speakBtn.classList.remove('playing');
        };
        window.speechSynthesis.speak(utterance);
        return true;
    }

    // ==================================================================
    // ファイル（音声・動画）からの取り込み ＆ トリミング
    // ==================================================================
    async function decodeAudioFromFile(file) {
        const arrayBuffer = await file.arrayBuffer();
        try {
            // まずは直接デコードを試す（音声ファイルは常にこれでOK。
            // 動画も、音声コンテナと構造が近い形式なら多くのブラウザでこのまま通る）
            return await audioContext.decodeAudioData(arrayBuffer);
        } catch (directDecodeError) {
            if (!file.type.startsWith('video/')) throw directDecodeError;
            // 動画コンテナを直接デコードできないブラウザ向けのフォールバック：
            // <video>要素で実際に再生しながら音声トラックだけをリアルタイムに抜き出す。
            // 時間はかかるが、対応できる動画形式の幅が広がる。
            showStatus('この動画は直接デコードできないため、再生しながら音声を抽出します（動画の長さ分、少し時間がかかります）...', 'warning', 0);
            return await extractAudioFromVideoRealtime(file);
        }
    }

    function extractAudioFromVideoRealtime(file) {
        return new Promise((resolve, reject) => {
            const videoEl = document.createElement('video');
            videoEl.style.display = 'none';
            videoEl.muted = true;
            videoEl.playsInline = true;
            document.body.appendChild(videoEl);
            const objectUrl = URL.createObjectURL(file);
            videoEl.src = objectUrl;

            const cleanup = () => {
                URL.revokeObjectURL(objectUrl);
                videoEl.remove();
            };

            videoEl.onerror = () => { cleanup(); reject(new Error('動画を読み込めませんでした')); };

            videoEl.onloadedmetadata = async () => {
                try {
                    const captureFn = videoEl.captureStream || videoEl.mozCaptureStream;
                    if (typeof captureFn !== 'function') {
                        throw new Error('このブラウザは動画からの音声抽出に対応していません');
                    }
                    const stream = captureFn.call(videoEl);
                    const audioTracks = stream.getAudioTracks();
                    if (audioTracks.length === 0) throw new Error('この動画に音声トラックが見つかりません');

                    const audioOnlyStream = new MediaStream(audioTracks);
                    const mimeType = getSupportedMimeType();
                    const recorder = mimeType ? new MediaRecorder(audioOnlyStream, { mimeType }) : new MediaRecorder(audioOnlyStream);
                    const chunks = [];
                    recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
                    recorder.onstop = async () => {
                        cleanup();
                        try {
                            const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
                            const arrayBuffer = await blob.arrayBuffer();
                            resolve(await audioContext.decodeAudioData(arrayBuffer));
                        } catch (err) { reject(err); }
                    };
                    recorder.start();
                    videoEl.currentTime = 0;
                    await videoEl.play();
                    videoEl.onended = () => { if (recorder.state === 'recording') recorder.stop(); };
                } catch (err) {
                    cleanup();
                    reject(err);
                }
            };
        });
    }

    async function handleAudioFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;
        if (!currentTarget) {
            showStatus('先に登録したい音・フレーズを選んでください。', 'warning');
            event.target.value = '';
            return;
        }
        showStatus('ファイルを読み込み中...', 'warning', 0);
        try {
            loadedFileAudioBuffer = await decodeAudioFromFile(file);
            elements.trimFilename.textContent = `${file.name}（長さ: ${loadedFileAudioBuffer.duration.toFixed(1)}秒）`;
            if (elements.trimAudioPreview.src) URL.revokeObjectURL(elements.trimAudioPreview.src);
            elements.trimAudioPreview.src = URL.createObjectURL(file);
            elements.trimStart.value = '0';
            elements.trimStart.max = loadedFileAudioBuffer.duration.toFixed(2);
            elements.trimEnd.value = Math.min(3, loadedFileAudioBuffer.duration).toFixed(2);
            elements.trimEnd.max = loadedFileAudioBuffer.duration.toFixed(2);
            elements.trimPanel.hidden = false;
            showStatus('読み込みが完了しました。開始・終了の秒数を指定して登録してください。', 'success');
        } catch (e) {
            console.error(e);
            showStatus('ファイルを読み込めませんでした。対応形式（mp3, wav, m4a等の音声、または音声トラック入りの動画）かご確認ください。', 'error');
            loadedFileAudioBuffer = null;
            elements.trimPanel.hidden = true;
        } finally {
            event.target.value = '';
        }
    }

    function sliceAudioBuffer(audioBuffer, startSec, endSec) {
        const sampleRate = audioBuffer.sampleRate;
        const startFrame = Math.max(0, Math.floor(startSec * sampleRate));
        const endFrame = Math.min(audioBuffer.length, Math.floor(endSec * sampleRate));
        const frameCount = Math.max(1, endFrame - startFrame);
        const numChannels = audioBuffer.numberOfChannels;
        const sliced = audioContext.createBuffer(numChannels, frameCount, sampleRate);
        for (let ch = 0; ch < numChannels; ch++) {
            const channelSlice = audioBuffer.getChannelData(ch).subarray(startFrame, startFrame + frameCount);
            sliced.copyToChannel(channelSlice, ch, 0);
        }
        return sliced;
    }

    // AudioBuffer を 16bit PCM の WAV Blob に変換する（MediaRecorderが使えない、
    // 「デコード済みバッファの一部分」を保存する場面のための簡易エンコーダー）
    function audioBufferToWavBlob(audioBuffer) {
        const numChannels = audioBuffer.numberOfChannels;
        const sampleRate = audioBuffer.sampleRate;
        const numFrames = audioBuffer.length;
        const bytesPerSample = 2;
        const blockAlign = numChannels * bytesPerSample;
        const dataSize = numFrames * blockAlign;
        const buffer = new ArrayBuffer(44 + dataSize);
        const view = new DataView(buffer);

        const writeString = (offset, str) => { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };

        writeString(0, 'RIFF');
        view.setUint32(4, 36 + dataSize, true);
        writeString(8, 'WAVE');
        writeString(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, numChannels, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * blockAlign, true);
        view.setUint16(32, blockAlign, true);
        view.setUint16(34, 16, true);
        writeString(36, 'data');
        view.setUint32(40, dataSize, true);

        const channelData = [];
        for (let ch = 0; ch < numChannels; ch++) channelData.push(audioBuffer.getChannelData(ch));

        let offset = 44;
        for (let frame = 0; frame < numFrames; frame++) {
            for (let ch = 0; ch < numChannels; ch++) {
                let sample = Math.max(-1, Math.min(1, channelData[ch][frame]));
                sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                view.setInt16(offset, sample, true);
                offset += 2;
            }
        }
        return new Blob([buffer], { type: 'audio/wav' });
    }

    function readTrimRange() {
        const start = parseFloat(elements.trimStart.value);
        const end = parseFloat(elements.trimEnd.value);
        return {
            start: Number.isFinite(start) ? Math.max(0, start) : 0,
            end: Number.isFinite(end) ? end : (loadedFileAudioBuffer ? loadedFileAudioBuffer.duration : 0)
        };
    }

    function handleTrimPreview() {
        if (!loadedFileAudioBuffer) return;
        const { start, end } = readTrimRange();
        if (end <= start) { showStatus('終了は開始より後の秒数にしてください。', 'warning'); return; }
        if (trimPreviewSource) {
            try { trimPreviewSource.stop(); } catch (e) { /* 既に停止済みの場合は無視 */ }
        }
        const sliced = sliceAudioBuffer(loadedFileAudioBuffer, start, end);
        const source = audioContext.createBufferSource();
        source.buffer = sliced;
        source.connect(gainNode);
        source.onended = () => { if (trimPreviewSource === source) trimPreviewSource = null; };
        trimPreviewSource = source;
        source.start();
    }

    async function handleTrimSave() {
        if (!loadedFileAudioBuffer || !currentTarget) return;
        const { start, end } = readTrimRange();
        if (end <= start) { showStatus('終了は開始より後の秒数にしてください。', 'warning'); return; }
        const label = currentTarget.type === 'char' ? `「${currentTarget.key}」` : `フレーズ「${currentTarget.key}」`;
        try {
            const sliced = sliceAudioBuffer(loadedFileAudioBuffer, start, end);
            const blob = audioBufferToWavBlob(sliced);
            await saveRecording(currentTarget, blob);
            showStatus(`${label}にファイルの音声を登録しました。`, 'success');
            await updateRecordedStatus();
            updateRecordHint();
            closeTrimPanel();
        } catch (e) {
            console.error(e);
            showStatus('登録に失敗しました。', 'error');
        }
    }

    function closeTrimPanel() {
        elements.trimPanel.hidden = true;
        loadedFileAudioBuffer = null;
        if (trimPreviewSource) {
            try { trimPreviewSource.stop(); } catch (e) { /* 既に停止済みの場合は無視 */ }
            trimPreviewSource = null;
        }
        if (elements.trimAudioPreview.src) {
            URL.revokeObjectURL(elements.trimAudioPreview.src);
            elements.trimAudioPreview.removeAttribute('src');
        }
    }

    // ==================================================================
    // データ管理システム
    // ==================================================================
    async function exportData() {
        try {
            showStatus('データをエクスポート中...', 'warning');
            const allVoices = await db.getAll('voices');
            const allPhrases = await db.getAll('phrases');
            if (allVoices.length === 0 && allPhrases.length === 0) {
                showStatus('保存するデータがありません。', 'error');
                return;
            }

            const blobToBase64 = blob => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });

            const exportableVoices = [];
            for (const voice of allVoices) {
                exportableVoices.push({ char: voice.char, base64: await blobToBase64(voice.blob) });
            }
            const exportablePhrases = [];
            for (const phrase of allPhrases) {
                exportablePhrases.push({ text: phrase.text, base64: await blobToBase64(phrase.blob) });
            }

            const jsonString = JSON.stringify({ version: "5.0", data: exportableVoices, phrases: exportablePhrases }, null, 2);
            const blob = new Blob([jsonString], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `jinriki-voice-backup-${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showStatus('データのエクスポートが完了しました。', 'success');
        } catch (error) {
            console.error(error);
            showStatus('エクスポートに失敗しました。', 'error');
        }
    }

    async function importData(event) {
        const file = event.target.files[0];
        if (!file) return;

        showStatus('データをインポート中...', 'warning');
        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const importedJson = JSON.parse(e.target.result);
                const importedVoiceData = (importedJson.data && Array.isArray(importedJson.data))
                    ? importedJson.data
                    : (Array.isArray(importedJson) ? importedJson : []);
                const importedPhraseData = Array.isArray(importedJson.phrases) ? importedJson.phrases : [];
                if (!Array.isArray(importedVoiceData)) throw new Error('データの形式が正しくありません');

                const base64ToBlob = (base64) => fetch(base64).then(res => res.blob());

                const voicesToImport = [];
                for (const item of importedVoiceData) {
                    if (item.char && item.base64 && TARGET_CHARS.includes(item.char)) {
                        voicesToImport.push({ char: item.char, blob: await base64ToBlob(item.base64) });
                    }
                }
                const phrasesToImport = [];
                for (const item of importedPhraseData) {
                    if (item.text && item.base64) {
                        phrasesToImport.push({ text: item.text, blob: await base64ToBlob(item.base64) });
                    }
                }

                if (voicesToImport.length === 0 && phrasesToImport.length === 0) {
                    throw new Error('有効なデータが見つかりません');
                }

                // 実際に上書きが発生する場合のみ、件数を示して確認する
                const currentVoiceKeys = await db.getAllKeys('voices');
                const currentPhraseKeys = await db.getAllKeys('phrases');
                const overwriteCount =
                    voicesToImport.filter(v => currentVoiceKeys.includes(v.char)).length +
                    phrasesToImport.filter(p => currentPhraseKeys.includes(p.text)).length;

                if (overwriteCount > 0) {
                    const confirmed = window.confirm(`既存のデータ（${overwriteCount}件）が上書きされます。続けますか？`);
                    if (!confirmed) {
                        showStatus('読み込みをキャンセルしました。');
                        return;
                    }
                }

                if (voicesToImport.length > 0) await db.bulkAdd('voices', voicesToImport);
                if (phrasesToImport.length > 0) {
                    await db.bulkAdd('phrases', phrasesToImport);
                    phrasesToImport.forEach(p => { if (!phraseTargets.includes(p.text)) phraseTargets.push(p.text); });
                }

                showStatus(`${voicesToImport.length + phrasesToImport.length}件のデータをインポートしました。`, 'success');
                await updateRecordedStatus();
                updateRecordHint();
            } catch (err) {
                console.error(err);
                showStatus('ファイルの読み込みに失敗しました。', 'error');
            } finally {
                event.target.value = '';
            }
        };
        reader.readAsText(file);
    }

    async function resetAllData() {
        if (!window.confirm('すべての録音データ（一音ずつ・フレーズの両方）を削除します。この操作は取り消せません。よろしいですか？')) return;
        try {
            await db.clear('voices');
            await db.clear('phrases');
            currentTarget = null;
            phraseTargets = [...QUICK_PHRASES];
            document.querySelectorAll('.char-button').forEach(btn => {
                btn.classList.remove('selected');
                btn.setAttribute('aria-selected', 'false');
            });
            await updateRecordedStatus();
            updateRecordHint();
            showStatus('すべての録音データを削除しました。', 'success');
        } catch (e) {
            showStatus('削除に失敗しました。', 'error');
        }
    }
  </script>
